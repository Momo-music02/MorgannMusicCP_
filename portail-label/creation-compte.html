<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Création de votre compte Artiste | Morgann Music CP</title>
    <link rel="stylesheet" href="js/reponsive.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #FC8FB0;
            border-radius: 50px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            background: #FC8FB0;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Activer votre compte</h2>
        <div id="status-msg">Vérification de votre invitation...</div>

        <form id="setup-form" style="display: none;" onsubmit="creerCompte(event)">
            <div class="form-group">
                <label>Adresse E-mail</label>
                <input type="email" id="email" disabled>
            </div>
            <div class="form-group">
                <label>Choisissez votre mot de passe *</label>
                <input type="password" id="password" required minlength="6" placeholder="******">
            </div>
            <button type="submit" class="btn">Créer mon compte</button>
        </form>

        <div id="error-msg" class="error"></div>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const targetEmail = (urlParams.get('email') || '').toLowerCase().trim();

        let artistDocId = null;
        let artistData = null;

        async function verifierLien() {
            const statusDiv = document.getElementById("status-msg");
            const errorDiv = document.getElementById("error-msg");

            if (!targetEmail) {
                statusDiv.innerText = "";
                errorDiv.innerText = "Lien invalide : Aucune adresse e-mail spécifiée.";
                return;
            }

            try {
                const q = query(collection(db, "label_artists"), where("email", "==", targetEmail));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    statusDiv.innerText = "";
                    errorDiv.innerText = "Aucune invitation trouvée pour cette adresse e-mail.";
                    return;
                }

                querySnapshot.forEach((d) => {
                    artistDocId = d.id;
                    artistData = d.data();
                });

                if (artistData.accountCreated) {
                    statusDiv.innerText = "";
                    errorDiv.innerText = "Ce compte a déjà été activé. Veuillez vous connecter.";
                    return;
                }

                document.getElementById("email").value = targetEmail;
                statusDiv.style.display = "none";
                document.getElementById("setup-form").style.display = "block";

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "";
                errorDiv.innerText = "Erreur de connexion à la base de données.";
            }
        }

        window.creerCompte = async function (e) {
            e.preventDefault();
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("error-msg");
            errorDiv.innerText = "";

            try {
                // 1. Création dans Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, targetEmail, password);
                const user = userCredential.user;

                // Mettre à jour le nom dans Firebase Auth
                if (artistData && artistData.name) {
                    await updateProfile(user, { displayName: artistData.name });
                }

                // 2. Initialisation du profil dans la collection "users"
                await setDoc(doc(db, "users", user.uid), {
                    email: targetEmail,
                    artistName: artistData.name || "",
                    role: "artist",
                    createdAt: new Date().toISOString()
                });

                // 3. Mise à jour du statut dans label_artists
                if (artistDocId) {
                    await updateDoc(doc(db, "label_artists", artistDocId), {
                        accountCreated: true,
                        userId: user.uid
                    });
                }

                // 4. Redirection vers index.html
                window.location.href = "index.html";

            } catch (error) {
                console.error("Erreur création de compte:", error);
                if (error.code === 'auth/email-already-in-use') {
                    errorDiv.innerText = "Cet e-mail est déjà associé à un compte Firebase.";
                } else if (error.code === 'auth/weak-password') {
                    errorDiv.innerText = "Le mot de passe doit contenir au moins 6 caractères.";
                } else {
                    errorDiv.innerText = "Erreur lors de la création : " + error.message;
                }
            }
        };

        verifierLien();
    </script>
</body>

</html>
