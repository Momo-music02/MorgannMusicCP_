<body class="login-page">
    <div id="navbar"></div>
    <main class="auth-card">
        <a class="brand" href="/index.html">Morgann Music <img src="/assets/img/logo/logo-rose.svg" alt="CP"></a>
        <h1>Connexion</h1>
        <p class="subtitle">Retrouve ton espace artiste.</p>

        <!-- Connexion via Google -->
        <button type="button" id="google-login-btn" class="social-btn google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18">
                <path fill="#4285F4"
                    d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z" />
                <path fill="#34A853"
                    d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.47 15.98 5.5 18 9 18z" />
                <path fill="#FBBC05"
                    d="M3.87 10.8c-.2-.58-.31-1.2-.31-1.8s.11-1.22.31-1.8L.97 4.99C.35 6.22 0 7.58 0 9s.35 2.78.97 4.01l2.9-2.21z" />
                <path fill="#EA4335"
                    d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.5 0 2.47 2.02.97 4.99l2.9 2.21C4.59 5.15 6.62 3.58 9 3.58z" />
            </svg>
            Continuer avec Google
        </button>

        <!-- Options de connexion alternatives (Passkey / Clé d'accès) -->
        <button type="button" id="passkey-login-btn" class="secondary">
            Connexion avec une Clé d'accès (Passkey / Biométrie)
        </button>

        <div class="divider">ou avec ton e-mail</div>

        <form id="login-form" novalidate>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div>
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <!-- Champ Code 2FA (affiché si l'utilisateur a configuré TOTP) -->
            <div id="totp-group" class="is-hidden">
                <label for="totp-code">Code Authentificateur (2FA)</label>
                <input id="totp-code" name="totp_code" type="text" inputmode="numeric" pattern="[0-9]{6}"
                    placeholder="123456" autocomplete="one-time-code">
            </div>
            <button type="submit">Se connecter</button>
            <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </form>

        <p class="helper">Pas encore de compte ? <a href="/signin.html">Créer un compte</a></p>
    </main>

    <script type="module" src="/assets/js/login.js"></script>
</body>

</html>
