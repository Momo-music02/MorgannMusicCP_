<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Label | Morgann Music CP</title>
    <link rel="stylesheet" href="js/reponsive.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #1e293b;
            box-sizing: border-box;
            padding: 20px;
        }

        .main-content {
            max-width: 800px;
            display: flex;
            margin-top: 3rem;
            flex-direction: column;
            gap: 2rem;
        }

        .settings-card {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgb(255, 255, 255);
            border-radius: 34px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin: 50px 0;
            box-sizing: border-box;
        }

        .settings-card h2 {
            margin-top: 0;
            color: #3e2837;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: #3e2837;
        }

        .form-group input,
        .form-group textarea {
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-family: inherit;
            font-size: 15px;
            background: #f8fafc;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #FC8FB0;
            background: #ffffff;
        }

        .btn-save {
            background-color: #FC8FB0;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
        }

        .btn-save:hover {
            background-color: #d01159;
        }

        .btn-save:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        /* Toggle Switch pour le Portail */
        .portal-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .portal-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #1e293b;
        }

        .portal-info p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #FC8FB0;
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }

        .btn-portal-manage {
            display: none;
            /* Masqué par défaut */
            background-color: #1e293b;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-portal-manage:hover {
            background-color: #0f172a;
        }

        .btn-portal-manage.show {
            display: block;
        }

        #loading-msg {
            text-align: center;
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>
    <script type="module" src="js/navbar.js"></script>
    <div id="sidebar-container"></div>
    <script src="js/sidebar.js"></script>

    <div class="main-content">
        <div id="loading-msg">Chargement des données du label...</div>

        <div id="label-content" style="display: none;">

            <!-- SECTION PORTAIL MARQUE BLANCHE -->
            <div class="settings-card">
                <h2>Portail Marque Blanche</h2>

                <div class="portal-section">
                    <div class="portal-info">
                        <h3>Activer mon Portail</h3>
                        <p>Permet à tes artistes de se connecter sur ton propre espace.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="portal-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <a href="portail.html" id="btn-manage-portal" class="btn-portal-manage">Gérer mon portail</a>
            </div>

            <!-- SECTION INFOS LABEL -->
            <div class="settings-card">
                <h2>Informations du Label</h2>
                <form id="update-label-form">
                    <div class="form-group">
                        <label for="label-name">Nom du Label</label>
                        <input type="text" id="label-name" required>
                    </div>

                    <div class="form-group">
                        <label for="label-manager">Nom de la gérante / du gérant</label>
                        <input type="text" id="label-manager" required>
                    </div>

                    <div class="form-group">
                        <label for="label-email">Email de contact professionnel</label>
                        <input type="email" id="label-email" required>
                    </div>

                    <div class="form-group">
                        <label for="label-description">Présentation courte / Bio</label>
                        <textarea id="label-description" rows="4"></textarea>
                    </div>

                    <button type="submit" id="btn-save-info" class="btn-save">Enregistrer les modifications</button>
                </form>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeLabelId = null;

        const portalToggle = document.getElementById('portal-toggle');
        const btnManagePortal = document.getElementById('btn-manage-portal');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/login.html";
                return;
            }

            currentUser = user;

            try {
                // On tape dans users/{uid}/labels
                const labelsSnapshot = await getDocs(collection(db, "users", user.uid, "labels"));

                if (labelsSnapshot.empty) {
                    document.getElementById('loading-msg').innerText = "Aucun label trouvé. Crée-le d'abord sur l'accueil.";
                    return;
                }

                // On prend le premier label trouvé
                const labelDoc = labelsSnapshot.docs[0];
                activeLabelId = labelDoc.id;
                const data = labelDoc.data();

                // Remplir le form
                document.getElementById('label-name').value = data.name || "";
                document.getElementById('label-manager').value = data.managerName || "";
                document.getElementById('label-email').value = data.contactEmail || "";
                document.getElementById('label-description').value = data.description || "";

                // Gérer l'état du portail
                const isPortalActive = data.portalActive || false;
                portalToggle.checked = isPortalActive;
                if (isPortalActive) {
                    btnManagePortal.classList.add('show');
                }

                document.getElementById('loading-msg').style.display = 'none';
                document.getElementById('label-content').style.display = 'block';

            } catch (error) {
                console.error("Erreur récupération du label:", error);
                document.getElementById('loading-msg').innerText = "Erreur de chargement. Check la console.";
            }
        });

        // Gestion de l'activation du portail en direct
        portalToggle.addEventListener('change', async (e) => {
            if (!activeLabelId || !currentUser) return;

            const isActive = e.target.checked;
            portalToggle.disabled = true; // On bloque le temps de la requête

            try {
                const labelRef = doc(db, "users", currentUser.uid, "labels", activeLabelId);
                await updateDoc(labelRef, {
                    portalActive: isActive
                });

                if (isActive) {
                    btnManagePortal.classList.add('show');
                } else {
                    btnManagePortal.classList.remove('show');
                }
            } catch (error) {
                console.error("Erreur update portail:", error);
                alert("Erreur réseau. Impossible de mettre à jour le statut du portail.");
                e.target.checked = !isActive; // rollback
            } finally {
                portalToggle.disabled = false;
            }
        });

        // Mise à jour des infos du label
        document.getElementById('update-label-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activeLabelId || !currentUser) return;

            const btnSave = document.getElementById('btn-save-info');
            btnSave.disabled = true;
            btnSave.innerText = "Sauvegarde...";

            try {
                const labelRef = doc(db, "users", currentUser.uid, "labels", activeLabelId);
                await updateDoc(labelRef, {
                    name: document.getElementById('label-name').value.trim(),
                    managerName: document.getElementById('label-manager').value.trim(),
                    contactEmail: document.getElementById('label-email').value.trim(),
                    description: document.getElementById('label-description').value.trim()
                });

                btnSave.innerText = "Modifications enregistrées !";
                setTimeout(() => {
                    btnSave.innerText = "Enregistrer les modifications";
                    btnSave.disabled = false;
                }, 2000);
            } catch (error) {
                console.error("Erreur sauvegarde infos label:", error);
                alert("Impossible de sauvegarder tes modifications.");
                btnSave.innerText = "Enregistrer les modifications";
                btnSave.disabled = false;
            }
        });

    </script>
</body>

</html>
