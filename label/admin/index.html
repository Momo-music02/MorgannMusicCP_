<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Portail Administrateur | MMCP</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <h2 class="page-title">Tableau de bord Administrateur & Actions Requises</h2>

            <div class="ai-grid-table">

                <!-- Carte 1 : Comptes utilisateurs -->
                <div class="ai-card-cell">
                    <div class="ai-card-title">
                        <span>Vérification Comptes</span>
                        <span class="badge">Sécurité</span>
                    </div>
                    <div id="comptes-box" class="ai-summary-box">
                        <span class="loader">Chargement des comptes...</span>
                    </div>
                </div>

                <!-- Carte 2 : Sorties globales de la plateforme -->
                <div class="ai-card-cell">
                    <div class="ai-card-title">
                        <span>Sorties à Vérifier</span>
                        <span class="badge">Distribution</span>
                    </div>
                    <div id="sorties-box" class="ai-summary-box">
                        <span class="loader">Comptage des sorties MMCP...</span>
                    </div>
                </div>

                <!-- Carte 3 : Support & Tickets -->
                <div class="ai-card-cell">
                    <div class="ai-card-title">
                        <span>Urgences Support</span>
                        <span class="badge">Tickets</span>
                    </div>
                    <div id="support-box" class="ai-summary-box">
                        <span class="loader">Lecture des tickets...</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            collection,
            collectionGroup,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);
        const auth = getAuth(app);

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(db, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        // CHARGEMENT DES MÉTRIQUES ADMIN
        async function chargerMetriquesAdmin() {
            const sortiesBox = document.getElementById("sorties-box");
            const comptesBox = document.getElementById("comptes-box");
            const supportBox = document.getElementById("support-box");

            // Sorties
            try {
                const sortiesSnapshot = await getDocs(collectionGroup(db, "releases"));
                let countMmcp = 0, countPlat = 0, totalReleases = 0;

                sortiesSnapshot.forEach(docSnap => {
                    totalReleases++;
                    const status = (docSnap.data().status || "").toLowerCase().trim();
                    if (status === "verification mmcp") countMmcp++;
                    else if (status.includes("plateforme")) countPlat++;
                });

                sortiesBox.innerHTML = `
                    <p class="stat-highlight">⚠️ <strong class="${countMmcp > 0 ? 'text-danger' : ''}">${countMmcp}</strong> sortie(s) en attente MMCP</p>
                    <p class="stat-subtext">• ${countPlat} en attente plateformes<br>• ${totalReleases} sortie(s) au total</p>
                `;
            } catch (err) {
                sortiesBox.innerHTML = `<span class="text-danger">Erreur de lecture des sorties</span>`;
            }

            // Comptes
            try {
                const usersSnapshot = await getDocs(collection(db, "users"));
                let totalUsers = 0, countLabelPlan = 0;

                usersSnapshot.forEach(docSnap => {
                    totalUsers++;
                    const plan = (docSnap.data().planName || "").toLowerCase();
                    if (plan.includes("label") || plan.includes("pro")) countLabelPlan++;
                });

                comptesBox.innerHTML = `
                    <p class="stat-highlight">👤 <strong>${totalUsers}</strong> compte(s) enregistrés</p>
                    <p class="stat-subtext">• ${countLabelPlan} abonnement(s) Plan Label / Pro</p>
                `;
            } catch (err) {
                comptesBox.innerHTML = `<span class="text-danger">Erreur de lecture des comptes</span>`;
            }

            // Tickets
            try {
                const ticketsSnapshot = await getDocs(collectionGroup(db, "tickets"));
                let openTickets = 0, urgentTickets = 0;

                ticketsSnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.status !== "fermé" && data.status !== "resolved") {
                        openTickets++;
                        if (data.priority === "haute" || data.priority === "urgent") urgentTickets++;
                    }
                });

                supportBox.innerHTML = `
                    <p class="stat-highlight">🎟️ <strong>${openTickets}</strong> ticket(s) ouvert(s)</p>
                    <p class="stat-subtext">• ${urgentTickets} urgence(s)</p>
                `;
            } catch (err) {
                supportBox.innerHTML = `<p class="stat-highlight">🎟️ <strong>0</strong> ticket urgent</p><p class="stat-subtext">Aucun problème signalé</p>`;
            }
        }

        // INITIALISATION
        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerMetriquesAdmin();
                chargerProfilNavbar(db, user);
            }
        });
    </script>
</body>

</html>
