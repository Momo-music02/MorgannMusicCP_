<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        /* Styles spécifiques pour la page des comptes */
        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            margin-top: 50px;
        }

        .search-bar-container {
            position: relative;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.292);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #FC8FB0;
        }

        .table-card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 20px;
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #000000;
            font-size: 14px;
        }

        .users-table th {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            color: #545454;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .users-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }


        /* Indiquer que la ligne est cliquable */
        .users-table tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .users-table tbody tr:hover {
            background: #fc8fb077 !important;
        }


        .users-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-small {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #FC8FB0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .plan-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
        }

        .plan-tag.free {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .plan-tag.pro,
        .plan-tag.label {
            background: rgba(208, 17, 89, 0.15);
            color: #fc8fb0;
            border: 1px solid rgba(208, 17, 89, 0.3);
        }

        .role-badge {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .role-badge.admin {
            color: #f43f5e;
        }

        .table-loading {
            text-align: center;
            padding: 40px !important;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="page-header-actions">
                <div>
                    <h2 class="page-title" style="margin: 0;">Gestion des Comptes & Utilisateurs</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Liste de tous les utilisateurs
                        enregistrés sur MMCP.</p>
                </div>

                <!-- Barre de recherche rapide -->
                <div class="search-bar-container">
                    <input type="text" id="user-search-input" class="search-input"
                        placeholder="Rechercher un nom, email..." />
                </div>
            </div>

            <!-- Tableau des comptes -->
            <div class="table-card">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Utilisateur</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Abonnement / Plan</th>
                            <th>Inscrit le</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="5" class="table-loading">
                                <span>Chargement des utilisateurs...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);
        const auth = getAuth(app);

        let listUsersCache = [];

        // Injections des composants réutilisables
        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    // Mettre en évidence le lien actif sur la sidebar
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        if (l.getAttribute('href') === 'admin-comptes.html' || l.getAttribute('href') === 'comptes.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(db, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        // Chargement et affichage des comptes
        async function chargerComptes() {
            const tbody = document.getElementById("users-table-body");

            try {
                const usersSnapshot = await getDocs(collection(db, "users"));
                listUsersCache = [];

                usersSnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    listUsersCache.push({ id: docSnap.id, ...data });
                });

                afficherTableauComptes(listUsersCache);
            } catch (err) {
                console.error("Erreur récupération comptes:", err);
                tbody.innerHTML = `<tr><td colspan="5" class="table-loading" style="color:#ef4444;">Erreur lors du chargement des données.</td></tr>`;
            }
        }

        // Rendu HTML du tableau avec redirection au clic
        function afficherTableauComptes(liste) {
            const tbody = document.getElementById("users-table-body");
            if (liste.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="table-loading">Aucun utilisateur trouvé.</td></tr>`;
                return;
            }

            tbody.innerHTML = liste.map(user => {
                const photoUrl = user.photoURL || user.photo || null;
                const firstName = user.firstName || "";
                const lastName = user.lastName || "";
                const fullName = `${firstName} ${lastName}`.trim() || user.displayName || "Utilisateur";
                const email = user.email || "—";
                const role = user.role || "Utilisateur";
                const plan = user.planName || user.plan || "Gratuit";

                // Formater la date
                let createdAt = "—";
                if (user.createdAt) {
                    const d = user.createdAt.toDate ? user.createdAt.toDate() : new Date(user.createdAt);
                    createdAt = d.toLocaleDateString('fr-FR');
                }

                const initials = fullName.charAt(0).toUpperCase();
                const avatarHTML = photoUrl
                    ? `<img src="${photoUrl}" alt="${fullName}">`
                    : `<span>${initials}</span>`;

                const isPro = plan.toLowerCase().includes("pro") || plan.toLowerCase().includes("label");
                const planClass = isPro ? "pro" : "free";

                // Redirection au clic grâce à data-id
                return `
            <tr class="user-row" data-id="${user.id}">
                <td>
                    <div class="user-cell">
                        <div class="user-avatar-small">${avatarHTML}</div>
                        <strong>${fullName}</strong>
                    </div>
                </td>
                <td>${email}</td>
                <td><span class="role-badge ${role.toLowerCase().includes('admin') ? 'admin' : ''}">${role}</span></td>
                <td><span class="plan-tag ${planClass}">${plan}</span></td>
                <td style="color: #94a3b8;">${createdAt}</td>
            </tr>
        `;
            }).join("");

            // Attacher l'événement de clic à chaque ligne
            document.querySelectorAll('.user-row').forEach(row => {
                row.addEventListener('click', () => {
                    const userId = row.getAttribute('data-id');
                    window.location.href = `compte.html?id=${userId}`;
                });
            });
        }

        // Filtre de recherche dynamique
        document.getElementById("user-search-input").addEventListener("input", (e) => {
            const searchVal = e.target.value.toLowerCase().trim();
            const filtered = listUsersCache.filter(u => {
                const name = `${u.firstName || ''} ${u.lastName || ''} ${u.displayName || ''}`.toLowerCase();
                const email = (u.email || '').toLowerCase();
                return name.includes(searchVal) || email.includes(searchVal);
            });
            afficherTableauComptes(filtered);
        });

        // Initialisation
        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(db, user);
                chargerComptes();
            }
        });
    </script>
</body>

</html>
