<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Compte | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .account-container {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            color: black;
            padding: 24px;
        }

        .profile-header-card {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .profile-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            overflow: hidden;
            border: 2px solid #FC8FB0;
            flex-shrink: 0;
        }

        .profile-avatar-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            color: #525252;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-control {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #FC8FB0;
        }

        .btn-save {
            background: #FC8FB0;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: #ae6178;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .item-card {
            background-color: rgba(232, 232, 232, 0.115);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 24px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 12px;
            text-align: center;
        }

        .item-cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            background: #334155;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 13px;
            font-weight: 600;
            color: #000000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-sub {
            font-size: 11px;
            color: #242424;
        }

        .alert-status {
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* Rend les cartes cliquables avec un effet survol */
        .items-grid .item-card {
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .items-grid .item-card:hover {
            transform: translateY(-3px);
            border-color: #FC8FB0;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <main class="main-container">
            <header id="navbar-injector" class="navbar-container"></header>

            <div class="account-container">

                <!-- EN-TÊTE PROFIL -->
                <div class="card profile-header-card">
                    <div class="profile-avatar-lg" id="avatar-container">
                        <span id="avatar-initials">?</span>
                    </div>
                    <div>
                        <h2 style="margin: 0; color: #000000;" id="header-user-name">Chargement...</h2>
                        <p style="margin: 4px 0 0 0; color: #3a3a3a; font-size: 14px;" id="header-user-email">—</p>
                    </div>
                </div>

                <!-- FORMULAIRE DES INFORMATIONS COMPTE -->
                <div class="card">
                    <h3 style="margin: 0; color: #000000;">Informations du compte</h3>

                    <form id="user-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Prénom (firstName)</label>
                                <input type="text" id="firstName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Nom (lastName)</label>
                                <input type="text" id="lastName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Nom complet (fullName)</label>
                                <input type="text" id="fullName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Nom d'artiste (artistName)</label>
                                <input type="text" id="artistName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Email (email)</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>URL Photo de profil (photoURL)</label>
                                <input type="text" id="photoURL" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Rôle (role)</label>
                                <input type="text" id="role" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Plan (planName)</label>
                                <input type="text" id="planName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Statut abonnement (subscriptionStatus)</label>
                                <input type="text" id="subscriptionStatus" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Adresse (address)</label>
                                <input type="text" id="address" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Ville (city)</label>
                                <input type="text" id="city" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Code Postal (postalCode)</label>
                                <input type="text" id="postalCode" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>IBAN (iban)</label>
                                <input type="text" id="iban" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Thème (theme)</label>
                                <input type="text" id="theme" class="form-control">
                            </div>
                        </div>

                        <button type="submit" class="btn-save">Enregistrer les modifications</button>
                        <div id="save-status" class="alert-status"></div>
                    </form>
                </div>

                <!-- SECTION DES SORTIES / RELEASES -->
                <div class="card">
                    <h3 style="margin: 0; color: #000000;">Sorties / Musiques</h3>
                    <div id="releases-grid" class="items-grid">
                        <p style="color: #454545; font-size: 14px;">Chargement des sorties...</p>
                    </div>
                </div>

                <!-- SECTION DES ARTISTES -->
                <div class="card">
                    <h3 style="margin: 0; color: #000000;">Artistes associés</h3>
                    <div id="artists-grid" class="items-grid">
                        <p style="color: #3e3e3e; font-size: 14px;">Chargement des artistes...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc,
            collection,
            getDocs,
            query,
            where,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Récupérer l'ID de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('id');

        const fields = [
            'firstName', 'lastName', 'fullName', 'artistName',
            'email', 'photoURL', 'role', 'planName',
            'subscriptionStatus', 'address', 'city', 'postalCode',
            'iban', 'theme'
        ];

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);
                }
                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(db, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection:", e);
            }
        }

        async function chargerInfosCompte() {
            if (!targetUserId) {
                alert("Aucun ID de compte spécifié dans l'URL.");
                return;
            }

            try {
                const docRef = doc(db, "users", targetUserId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    document.getElementById('header-user-name').textContent = "Utilisateur introuvable";
                    return;
                }

                const data = docSnap.data();

                // Remplir les champs du formulaire (vide si absent/non défini)
                fields.forEach(field => {
                    const input = document.getElementById(field);
                    if (input) {
                        input.value = data[field] !== undefined && data[field] !== null ? data[field] : "";
                    }
                });

                // En-tête
                const name = data.fullName || `${data.firstName || ''} ${data.lastName || ''}`.trim() || "Utilisateur";
                document.getElementById('header-user-name').textContent = name;
                document.getElementById('header-user-email').textContent = data.email || "Sans email";

                // Avatar
                const avatarContainer = document.getElementById('avatar-container');
                if (data.photoURL) {
                    avatarContainer.innerHTML = `<img src="${data.photoURL}" alt="Avatar">`;
                } else {
                    avatarContainer.innerHTML = `<span>${name.charAt(0).toUpperCase()}</span>`;
                }

                // Charger Sorties et Artistes
                chargerSorties();
                chargerArtistes();

            } catch (err) {
                console.error("Erreur chargement compte:", err);
            }
        }

        // Sauvegarde des modifications
        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('save-status');
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#94a3b8';
            statusDiv.textContent = "Mise à jour en cours...";

            try {
                const updateData = {
                    updatedAt: serverTimestamp()
                };

                fields.forEach(field => {
                    const val = document.getElementById(field).value.trim();
                    updateData[field] = val;
                });

                await updateDoc(doc(db, "users", targetUserId), updateData);

                statusDiv.style.color = '#10b981';
                statusDiv.textContent = "Modifications enregistrées avec succès !";
                setTimeout(() => statusDiv.style.display = 'none', 3000);

            } catch (err) {
                console.error("Erreur mise à jour :", err);
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = "Erreur lors de la sauvegarde.";
            }
        });

        // Charger les sorties de l'utilisateur avec redirection au clic
        async function chargerSorties() {
            const grid = document.getElementById('releases-grid');
            try {
                let releasesSnap = await getDocs(collection(db, "users", targetUserId, "releases"));

                if (releasesSnap.empty) {
                    const q = query(collection(db, "releases"), where("userId", "==", targetUserId));
                    releasesSnap = await getDocs(q);
                }

                if (releasesSnap.empty) {
                    grid.innerHTML = `<p style="color: #94a3b8; font-size: 14px;">Aucune sortie trouvée.</p>`;
                    return;
                }

                grid.innerHTML = releasesSnap.docs.map(docSnap => {
                    const rel = docSnap.data();
                    const relId = docSnap.id;
                    const title = rel.title || rel.name || "Sans titre";
                    const cover = rel.coverUrl || rel.cover || rel.pochette || "";
                    const type = rel.type || "Single";

                    return `
                <div class="item-card release-item" data-id="${relId}">
                    ${cover ? `<img src="${cover}" class="item-cover" alt="Cover">` : `<div class="item-cover" style="display:flex;align-items:center;justify-content:center;color:#64748b;">Pas de cover</div>`}
                    <div class="item-title" title="${title}">${title}</div>
                    <div class="item-sub">${type}</div>
                </div>
            `;
                }).join('');

                // Clic -> Redirection vers sortie.html?id=...
                document.querySelectorAll('.release-item').forEach(card => {
                    card.addEventListener('click', () => {
                        const releaseId = card.getAttribute('data-id');
                        window.location.href = `sortie.html?id=${releaseId}`;
                    });
                });

            } catch (e) {
                console.error("Erreur chargement sorties:", e);
                grid.innerHTML = `<p style="color: #94a3b8; font-size: 14px;">Impossible de charger les sorties.</p>`;
            }
        }

        // Charger les artistes associés au compte avec redirection au clic
        async function chargerArtistes() {
            const grid = document.getElementById('artists-grid');
            try {
                let artistsSnap = await getDocs(collection(db, "users", targetUserId, "artists"));

                if (artistsSnap.empty) {
                    const q = query(collection(db, "artists"), where("userId", "==", targetUserId));
                    artistsSnap = await getDocs(q);
                }

                if (artistsSnap.empty) {
                    grid.innerHTML = `<p style="color: #94a3b8; font-size: 14px;">Aucun artiste associé.</p>`;
                    return;
                }

                grid.innerHTML = artistsSnap.docs.map(docSnap => {
                    const art = docSnap.data();
                    const artistId = docSnap.id;
                    const name = art.name || art.artistName || "Artiste";
                    const pdp = art.photoURL || art.image || art.avatar || "";

                    return `
                <div class="item-card artist-item" data-id="${artistId}">
                    ${pdp ? `<img src="${pdp}" class="item-cover" style="border-radius:50%;" alt="PDP">` : `<div class="item-cover" style="border-radius:50%;display:flex;align-items:center;justify-content:center;color:#64748b;">Pas de photo</div>`}
                    <div class="item-title" title="${name}">${name}</div>
                </div>
            `;
                }).join('');

                // Clic -> Redirection vers artiste.html?id=...
                document.querySelectorAll('.artist-item').forEach(card => {
                    card.addEventListener('click', () => {
                        const artistId = card.getAttribute('data-id');
                        window.location.href = `artiste.html?id=${artistId}`;
                    });
                });

            } catch (e) {
                console.error("Erreur chargement artistes:", e);
                grid.innerHTML = `<p style="color: #94a3b8; font-size: 14px;">Impossible de charger les artistes.</p>`;
            }
        }        // Initialisation
        injecterComposants();
        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(db, user);
            }
            chargerInfosCompte();
        });
    </script>
</body>

</html>
