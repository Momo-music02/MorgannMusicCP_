<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Retraits (Admin) - MM-CP</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .admin-card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 24px;
            margin: 50px 0 20px 0;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000000;
            border-bottom: 1px solid #000000;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #FC8FB0;
            color: #000000;
        }

        th {
            background: #FC8FB0;
            color: #ffffff;
            border-radius: 30px 30px 0 0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
        }

        tr:hover {
            background: #fc8fb070;
        }

        select {
            background: #FC8FB0;
            border: 1px solid #ffffff;
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 50px;
            font-weight: 600;
            outline: none;
        }

        select:focus {
            border-color: #FC8FB0;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-demande {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .badge-envoye {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-refuse {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="admin-card">
                <div class="card-title">Gestion des demandes de retrait</div>
                <table>
                    <thead>
                        <tr>
                            <th>Utilisateur</th>
                            <th>Montant</th>
                            <th>IBAN</th>
                            <th>Statut actuel</th>
                            <th>Changer le statut</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawals-body">
                        <tr>
                            <td colspan="5" style="text-align:center; color:#94a3b8;">Chargement des demandes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    // Mettre en évidence le lien actif sur la sidebar (à adapter selon le nom de ton fichier de retraits, ex: retraits.html)
                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        if (l.getAttribute('href') === 'retraits.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(db, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(db, user);
                chargerDemandes();
            } else {
                window.location.href = "login.html";
            }
        });

        async function chargerDemandes() {
            const tbody = document.getElementById("withdrawals-body");
            tbody.innerHTML = "";

            try {
                const snap = await getDocs(collection(db, "withdrawals"));
                if (snap.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Aucune demande de retrait enregistrée.</td></tr>`;
                    return;
                }

                snap.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    const tr = document.createElement("tr");

                    let badgeClass = "badge-demande";
                    if (data.status === "envoyé") badgeClass = "badge-envoye";
                    if (data.status === "refusé") badgeClass = "badge-refuse";

                    tr.innerHTML = `
                        <td>${data.userEmail || data.userId}</td>
                        <td><strong>${(data.amount || 0).toFixed(2)} €</strong></td>
                        <td style="font-family: monospace;">${data.iban || "-"}</td>
                        <td><span class="badge ${badgeClass}">${data.status}</span></td>
                        <td>
                            <select onchange="modifierStatut('${id}', '${data.userId}', ${data.amount}, this.value)">
                                <option value="demandé" ${data.status === "demandé" ? "selected" : ""}>demandé</option>
                                <option value="envoyé" ${data.status === "envoyé" ? "selected" : ""}>envoyé</option>
                                <option value="refusé" ${data.status === "refusé" ? "selected" : ""}>refusé</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center;">Erreur : ${err.message}</td></tr>`;
            }
        }

        window.modifierStatut = async function (withdrawId, userId, amount, nouveauStatut) {
            try {
                // 1. Mettre à jour le statut du retrait
                await updateDoc(doc(db, "withdrawals", withdrawId), {
                    status: nouveauStatut
                });

                // 2. Créer une notification pour l'utilisateur
                let titre = "Mise à jour de votre retrait";
                let messageNotif = `Le statut de votre demande de retrait de ${amount.toFixed(2)} € est désormais : ${nouveauStatut}.`;

                await addDoc(collection(db, "users", userId, "notifications"), {
                    titre: titre,
                    notif: messageNotif,
                    createdAt: serverTimestamp()
                });

                alert("Statut mis à jour et notification envoyée !");
                chargerDemandes();
            } catch (err) {
                alert("Erreur lors de la modification : " + err.message);
            }
        };

        injecterComposants();
    </script>
</body>

</html>
