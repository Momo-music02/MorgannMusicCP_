<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Sorties | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-bar-container {
            position: relative;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #d01159;
        }

        .table-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
        }

        .releases-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #f8fafc;
            font-size: 14px;
        }

        .releases-table th {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .releases-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        .releases-table tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .releases-table tbody tr:hover {
            background: #273549 !important;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
        }

        .status-direct {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-verification {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-livree {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-retrait {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .table-loading {
            text-align: center;
            padding: 40px !important;
            color: #94a3b8;
        }

        .upc-code {
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="page-header-actions">
                <div>
                    <h2 class="page-title" style="margin: 0;">Gestion des Sorties</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Liste intégrale des sorties du
                        catalogue MMCP.</p>
                </div>

                <div class="search-bar-container">
                    <input type="text" id="release-search-input" class="search-input"
                        placeholder="Rechercher titre, artiste, UPC..." />
                </div>
            </div>

            <div class="table-card">
                <table class="releases-table">
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Artiste</th>
                            <th>Format</th>
                            <th>Code UPC</th>
                            <th>Statut</th>
                            <th>Date de Sortie</th>
                        </tr>
                    </thead>
                    <tbody id="releases-table-body">
                        <tr>
                            <td colspan="6" class="table-loading">
                                <span>Chargement des sorties...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collectionGroup, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSPUArpApBuK0Cn9VbeMtqk4JC-gqruJc",
            authDomain: "morgann-music-cp.firebaseapp.com",
            projectId: "morgann-music-cp",
            storageBucket: "morgann-music-cp.firebasestorage.app",
            messagingSenderId: "666812685196",
            appId: "1:666812685196:web:fe3df6749ae768d68494a9",
            measurementId: "G-FKSSXYEZF0"
        };

        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);
        const auth = getAuth(app);

        let listReleasesCache = [];

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        if (l.getAttribute('href') === 'sorties.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(db, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        async function chargerToutesLesSorties() {
            const tbody = document.getElementById("releases-table-body");

            try {
                const groupRef = collectionGroup(db, "releases");
                const querySnapshot = await getDocs(groupRef);
                listReleasesCache = [];

                querySnapshot.forEach(docSnap => {
                    listReleasesCache.push({ id: docSnap.id, ...docSnap.data() });
                });

                afficherTableauSorties(listReleasesCache);
            } catch (err) {
                console.error("Erreur chargement sorties:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="table-loading" style="color:#ef4444;">Erreur lors du chargement des sorties.</td></tr>`;
            }
        }

        function afficherTableauSorties(liste) {
            const tbody = document.getElementById("releases-table-body");
            if (liste.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="table-loading">Aucune sortie trouvée.</td></tr>`;
                return;
            }

            tbody.innerHTML = liste.map(rel => {
                const title = rel.title || "Sans titre";
                const artist = rel.artistName || "Artiste inconnu";
                const format = rel.format || rel.type || "Single";
                const upc = rel.upc || "—";
                const status = rel.status || "Vérification MMCP";
                const releaseDate = rel.releaseDate || "—";

                let badgeClass = "status-verification";
                if (status === "direct") badgeClass = "status-direct";
                if (status === "livrée") badgeClass = "status-livree";
                if (status === "retrait" || status === "retiré") badgeClass = "status-retrait";

                return `
            <tr class="release-row" data-id="${rel.id}">
                <td><strong>${title}</strong></td>
                <td>${artist}</td>
                <td>${format}</td>
                <td><span class="upc-code">${upc}</span></td>
                <td><span class="badge-status ${badgeClass}">${status}</span></td>
                <td style="color: #94a3b8;">${releaseDate}</td>
            </tr>
        `;
            }).join("");

            document.querySelectorAll('.release-row').forEach(row => {
                row.addEventListener('click', () => {
                    const releaseId = row.getAttribute('data-id');
                    window.location.href = `sortie.html?id=${releaseId}`;
                });
            });
        }

        document.getElementById("release-search-input").addEventListener("input", (e) => {
            const searchVal = e.target.value.toLowerCase().trim();
            const filtered = listReleasesCache.filter(r => {
                const title = (r.title || "").toLowerCase();
                const artist = (r.artistName || "").toLowerCase();
                const upc = (r.upc || "").toLowerCase();
                return title.includes(searchVal) || artist.includes(searchVal) || upc.includes(searchVal);
            });
            afficherTableauSorties(filtered);
        });

        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(db, user);
                chargerToutesLesSorties();
            }
        });
    </script>
</body>

</html>
